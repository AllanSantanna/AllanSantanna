name: Generate Animated Circuit Banners

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/animated-banners.yml'
      - 'scripts/generate_banners.py'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image library
        run: python -m pip install Pillow
      - name: Generate animated banners
        run: python scripts/generate_banners.py
      - name: Commit GIFs and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/circuit-header.gif assets/circuit-footer.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m "design: publish animated red circuit GIF banners"
            git push
          fi
